# Local Postgres for exercising the postgresql dialect (ON CONFLICT syntax
# is shared with SQLite, but it's worth running the real thing before you
# claim it works). SQLite via .env.example is fine for day-to-day dev.
#
#   docker compose -f deploy/docker-compose.local.yml up -d
#   $env:DATABASE_URL = "postgresql+psycopg2://pipeline:localdev@localhost:5432/earthquakes"
#   python -m pipeline.run --dry-run
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: earthquakes
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
